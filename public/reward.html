<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>支持作者 · DJI 素材管理器</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f7f9;
      color: #1c1f24;
      font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }
    main {
      width: min(680px, 96vw);
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,.08);
      padding: 26px 28px 22px;
    }
    h1 { margin: 0 0 6px; font-size: 20px; }
    p.lead { margin: 0 0 18px; color: #5d6570; font-size: 13px; line-height: 1.6; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card {
      border: 1px solid #e6e8ec;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      background: #fbfbfc;
    }
    .card h2 { margin: 0 0 10px; font-size: 15px; }
    .qr {
      width: 100%;
      max-width: 260px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      border-radius: 10px;
      background: #fff;
      border: 1px solid #eceef1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .qr img { width: 100%; height: 100%; object-fit: contain; }
    .qr.empty {
      color: #98a1ad;
      font-size: 12px;
      line-height: 1.5;
      padding: 12px;
    }
    .footer {
      margin-top: 16px;
      color: #5d6570;
      font-size: 12px;
      line-height: 1.6;
    }
    .footer strong { color: #1c1f24; }
  </style>
</head>
<body>
  <main>
    <h1>支持作者</h1>
    <p class="lead">如果你觉得这个工具好用，欢迎自愿请作者喝杯咖啡。打赏不会解锁任何额外功能，也不影响软件使用。</p>
    <div class="grid">
      <section class="card">
        <h2>微信</h2>
        <div class="qr">
          <img src="/branding/wechat-reward-qr.png" alt="微信二维码"
               onerror="this.parentElement.classList.add('empty'); this.remove(); this.parentElement.textContent='请放置 branding/wechat-reward-qr.png';">
        </div>
      </section>
      <section class="card">
        <h2>支付宝</h2>
        <div class="qr">
          <img src="/branding/alipay-reward-qr.png" alt="支付宝二维码"
               onerror="this.parentElement.classList.add('empty'); this.remove(); this.parentElement.textContent='请放置 branding/alipay-reward-qr.png';">
        </div>
      </section>
    </div>
    <p class="footer">
      作者：<strong>JackHe</strong> · 微信号：<strong>JackHe6</strong><br>
      如二维码被冒用或需要更换，请通过 GitHub Issue 反馈。
    </p>
  </main>
</body>
</html>
